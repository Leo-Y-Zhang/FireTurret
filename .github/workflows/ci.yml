# CI is a WRAPPER around scripts/verify.py, not a second definition of "green".
#
# The local gate is the source of truth. Giving CI its own checklist is exactly
# how a project ends up with two definitions of passing — one here, one in
# whatever the maintainer runs — which drift until a CI-only failure appears
# that nobody can reproduce locally.
#
# So this file installs dependencies and calls the local gate. Adding a check
# here that is not in verify.py would recreate the drift; add it there instead.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only ever read the checkout. Declared
# explicitly so the workflow keeps its own floor even if the repository
# default token permission is widened later.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The gate legitimately takes ~34 minutes: the slow golden/e2e tier alone runs
    # for ~29 of them (measured on the first hosted run that got far enough to
    # finish). Without a cap a hung Qt test would sit on the runner for GitHub's
    # default 360 minutes. 60 gives the gate roughly 1.8x its measured runtime and
    # bounds a hang at one hour.
    timeout-minutes: 60
    strategy:
      matrix:
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          # verify.py audits the whole author history for non-noreply identities,
          # so it needs the full history rather than a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # libgl1/libglib2.0-0 are OpenCV's. The rest are Qt's: even under
      # QT_QPA_PLATFORM=offscreen, importing PySide6 dlopens libEGL, and pytest-qt
      # imports it at collection time, so without these NO test runs -- the failure is
      # `ImportError: libEGL.so.1: cannot open shared object file`, not a test error.
      - name: Install headless OpenCV and Qt deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libegl1 libxkbcommon0 libdbus-1-3
      - run: python -m pip install --upgrade pip
      # `desktop` is required, not optional, despite only the studio needing Qt at
      # runtime: the `dev` extra pulls in pytest-qt, and pytest-qt refuses to collect
      # ANY test without a Qt binding, which lives in `desktop`. Without it both the
      # fast and slow pytest checks abort before running a single test, which is
      # exactly what CI did on every run it has ever attempted.
      - run: pip install -e .[dev,analysis,desktop]

      # THE gate. One command, and the same one a contributor runs locally.
      - name: verify
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/verify.py
  # The gitleaks binary directly rather than gitleaks-action, and the whole
  # history rather than a diff. The action scans only the range
  # <before>^..<after> that a push touched, so a secret committed earlier and
  # never edited again is never looked at; and on a repository's first push the
  # parent of the root commit does not exist, so it fails outright.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - run: gitleaks detect --source . --redact --exit-code 1 --log-opts=--all
